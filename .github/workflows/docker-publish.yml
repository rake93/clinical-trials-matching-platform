name: Build & Push RunPod Image

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.runpod"
      - "docker/entrypoint.sh"
      - "scripts/pre_requisites.sh"
      - "agentic-reasoning/pyproject.toml"
      - "data-ingestion/requirements.txt"
      - "data-acquisition/pyproject.toml"
      - "palantir-blueprint/package.json"
      - "palantir-blueprint/package-lock.json"
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Free tier: 2,000 min/month (public repo = unlimited)
    # Build takes ~30-40 min on ubuntu-latest (2 vCPU)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          # Cache layers in GitHub Actions cache (speeds up rebuilds)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-platform:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/healthcare-platform:${{ github.sha }}
          build-args: |
            REPO_URL=https://github.com/${{ github.repository }}.git
            REPO_BRANCH=${{ github.ref_name }}
